name: CI

on:
  push:
  pull_request:

jobs:
  l10n:
    name: Localization check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generated strings are up to date
        run: |
          python3 tools/gen_strings.py
          git diff --exit-code -- android/app/src/main/res
      - name: Check EN/RU strings, placeholders, hard-coded UI text, toast codes
        run: python3 tools/check_l10n.py

  core-tests:
    name: Rust core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: cargo test
        working-directory: rust
        run: cargo test --release

  android:
    name: Android build (debug + release APK)
    runs-on: ubuntu-latest
    needs: [l10n, core-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: SDK, build-tools and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug and release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: drift-apk
          path: android/app/build/outputs/apk/**/*.apk
